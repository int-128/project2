{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Змейка</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            margin: 0;
        }
        canvas {
            background: #111;
            border: 2px solid #0f0;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 24px;
        }
		#saved_score {
            position: absolute;
            top: 50px;
            left: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="score">Очки: 0</div><br>
	<div id="saved_score">Сохранённые очки: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <script src="{% static 'snake/snake.js' %}"></script>
</body>
</html>
