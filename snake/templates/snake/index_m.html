{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            margin: 0;
        }

        #score, #saved_score, #user_id {
            position: absolute;
            left: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 24px;
        }
        #score { top: 20px; }
        #saved_score { top: 50px; }
        #user_id { top: 80px; }

        /* === GRID СЕТКА === */
        .container {
			display: grid;
			grid-template-columns: 140px 400px 140px; /* X = 0,1,2 */
			grid-template-rows: 1fr 1fr; /* две равные строки */
			gap: 15px;
			background: #333;
			padding: 20px;
			border-radius: 12px;
			box-shadow: 0 0 20px #0008;
		}

        button {
            border: none;
            border-radius: 8px;
            background: linear-gradient(180deg, #4a90e2, #357abd);
            color: white;
            font-weight: bold;
            cursor: pointer;
            padding: 14px 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.15s ease, filter 0.15s ease;
            font-size: 16px;
			height: 100%;
        }
        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        #game {
            grid-column: 2;
            grid-row: 1 / 3; /* растянут по двум строкам */
            background: #000;
            border-radius: 10px;
        }

        /* Координаты (X,Y) */
        #up_button {
			grid-column: 1;
			grid-row: 1;
		}
		
        #down_button {
			grid-column: 1;
			grid-row: 2;
		}
		
        #left_button {
			grid-column: 3;
			grid-row: 1;
		}
		
        #right_button {
			grid-column: 3;
			grid-row: 2;
		}

		@media (max-width: 1000px) {
			.container {
				transform: scale(0.9);
			}
		}

        @media (max-width: 800px) {
			.container {
				transform: scale(0.7);
			}
		}
		
		@media (max-width: 650px) {
			.container {
				transform: scale(0.55);
			}
		}
    </style>
</head>
<body>
    <div id="score">Очки: 0</div>
    <div id="saved_score">Сохранённые очки: -</div>
    <div id="user_id">ID: -</div>

    <div class="container">
        <button id="up_button">Up</button>
        <button id="down_button">Down</button>
        <canvas id="game" width="400" height="400"></canvas>
        <button id="left_button">Left</button>
        <button id="right_button">Right</button>
    </div>

    <script src="{% static 'snake/snake.js' %}"></script>
</body>
</html>
